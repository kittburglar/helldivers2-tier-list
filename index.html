<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helldivers 2 Tier Lists</title>
<style>
  :root{
    --bg:#0f1115;
    --card:#161922;
    --border:#262b38;
    --text:#e8e9ee;
    --text-secondary:#9a9fb0;
    --text-muted:#6b7080;
    --splus:#e2483f;
    --s:#e0a82b;
    --a:#4ba86b;
    --b:#3f8fd6;
    --c:#5a5f70;
    --d:#3a3d47;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
    padding:0 0 4rem;
  }
  header{
    padding:3rem 1.5rem 2rem;
    text-align:center;
    border-bottom:1px solid var(--border);
    margin-bottom:1.5rem;
  }
  header h1{
    font-size:28px;
    font-weight:700;
    margin:0 0 8px;
    letter-spacing:-0.02em;
  }
  header p{
    color:var(--text-secondary);
    font-size:14px;
    margin:0 0 4px;
  }
  #last-updated{
    font-size:12px;
    color:var(--text-muted);
  }
  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:0 1.5rem;
  }
  .legend{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:2.5rem;
    font-size:13px;
    color:var(--text-secondary);
  }
  .legend span{display:flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  section.category{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:1.75rem 1.75rem 1.25rem;
    margin-bottom:1.75rem;
  }
  .cat-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:1.25rem;
  }
  .cat-head h2{
    font-size:18px;
    font-weight:700;
    margin:0;
  }
  .cat-head .icon{
    width:28px;height:28px;
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.06);
    font-size:15px;
  }
  .tier-row{
    display:flex;
    gap:14px;
    align-items:flex-start;
    margin-bottom:10px;
  }
  .tier-badge{
    flex:0 0 44px;
    text-align:center;
    font-size:13px;
    font-weight:700;
    border-radius:8px;
    padding:6px 0;
    color:#0f1115;
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    padding-top:4px;
    flex:1;
  }
  .chip{
    font-size:12.5px;
    padding:4px 10px;
    border-radius:999px;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border);
    color:var(--text);
    white-space:nowrap;
  }
  footer{
    text-align:center;
    color:var(--text-muted);
    font-size:12px;
    margin-top:2rem;
  }
  @media (max-width:600px){
    header h1{font-size:22px}
    section.category{padding:1.25rem 1.1rem 1rem}
  }
</style>
</head>
<body>

<header>
  <h1>Helldivers 2 — tier lists</h1>
  <p>Warbonds · primary &amp; secondary weapons · grenades · armor passives</p>
  <p id="last-updated"></p>
</header>

<div class="wrap">
  <div class="legend" id="legend"></div>
  <div id="categories"></div>
  <footer>
    Community consensus tier lists. Meta shifts with balance patches — treat as a snapshot, not gospel.
    <br>To update: edit the <code>DATA</code> object at the top of the &lt;script&gt; tag in this file, then reload.
  </footer>
</div>

<script>
/* ============================================================
   EDIT THIS SECTION WHEN THE META CHANGES - nothing else needs
   to be touched. Add/remove/move items between tier arrays,
   add or remove whole categories, or change LAST_UPDATED.
   Tiers must be one of: "S+","S","A","B","C","D"
   ============================================================ */

const LAST_UPDATED = "July 24, 2026 - patch 6.3.1";

const DATA = [
  {
    name: "Warbonds",
    icon: "\uD83C\uDFC5",
    tiers: {
      "S+": ["Democratic Detonation", "Dust Devils", "Control Group", "Servants of Freedom"],
      "S":  ["Redacted Regiment", "Polar Patriots", "Siege Breakers", "Exo Experts"],
      "A":  ["Urban Legends", "Entrenched Division", "Borderline Justice", "Freedom's Flame"],
      "B":  ["Chemical Agents", "Cutting Edge", "Steeled Veterans", "Viper Commandos", "Truth Enforcers", "Python Commandos"],
      "C":  ["Force of Law", "Masters of Ceremony"],
      "D":  ["Halo: ODST", "Righteous Revenants"]
    }
  },
  {
    name: "Primary weapons",
    icon: "\uD83C\uDFAF",
    tiers: {
      "S+": ["Eruptor", "Purifier", "Explosive Crossbow", "Punisher Plasma"],
      "S":  ["Scorcher", "Censor", "Diligence"],
      "A":  ["Coyote", "Sweeper", "Variable", "Double Freedom", "Dominator", "Double-Edge Sickle", "Scythe", "Trident"],
      "B":  ["Sickle", "Tenderizer", "Liberator Carbine", "Reprimand", "Stoker", "Gallant"],
      "C":  ["Breaker", "Breaker Incendiary", "Torcher"],
      "D":  ["Constitution", "Liberator Concussive", "Blitzer"]
    }
  },
  {
    name: "Secondary weapons",
    icon: "\uD83D\uDD2B",
    tiers: {
      "S+": ["Grenade Pistol", "Senator", "Ultimatum"],
      "S":  ["Talon", "Loyalist", "Re-Educator"],
      "A":  ["Warrant", "Verdict", "Veto", "Missile Pistol", "Redeemer", "Stim Pistol", "Crisper"],
      "B":  ["SOCOM", "Machete"],
      "C":  ["Saber", "Combat Hatchet", "Dagger", "Bushwhacker"],
      "D":  ["Peacemaker", "Stun Lance", "Stun Baton", "Entrenchment Tool"]
    }
  },
  {
    name: "Grenades",
    icon: "\uD83D\uDCA3",
    tiers: {
      "S+": ["Thermite"],
      "S":  ["Gas", "Dynamite", "Shield", "Stun"],
      "A":  ["Incendiary Impact", "Incendiary", "Impact", "Lure Mine", "Pyrotech", "High Explosive", "Pineapple", "Giga Grenade", "Seeker", "Frag"],
      "B":  ["Smokescreen", "Smoke"],
      "C":  ["Arc"],
      "D":  ["Urchin", "Throwing Knife"]
    }
  },
  {
    name: "Armor passives",
    icon: "\uD83D\uDEE1\uFE0F",
    tiers: {
      "S+": ["Med-Kit", "Siege-Ready", "Engineering Kit", "Oxygenator"],
      "S":  ["Reduced Signature", "Ballistic Padding", "Concussive Padding (Reinforced)", "Desert Stormer", "Acclimated"],
      "A":  ["Unflinching", "Peak Physique", "Democracy Protects", "Concussive Padding (Hazmat)", "Concussive Padding (Grenadier)", "Fortified", "Scout", "Adreno-Defibrillator", "Inflammable"],
      "B":  ["Rock Solid", "Reinforced Epaulettes", "Gunslinger", "Extra Padding", "Supplementary Adrenaline", "Feet First", "Servo-Assisted"],
      "C":  ["Integrated Explosives", "Advanced Filtration"],
      "D":  ["Electrical Conduit"]
    }
  }
];

/* ============================================================
   RENDER LOGIC - no need to touch anything below this line
   ============================================================ */

const TIER_ORDER = ["S+", "S", "A", "B", "C", "D"];
const TIER_COLOR = {
  "S+": "var(--splus)",
  "S": "var(--s)",
  "A": "var(--a)",
  "B": "var(--b)",
  "C": "var(--c)",
  "D": "var(--d)"
};

document.getElementById("last-updated").textContent = "Last updated: " + LAST_UPDATED;

const legendEl = document.getElementById("legend");
legendEl.innerHTML = TIER_ORDER.map(function(t){
  return '<span><i class="dot" style="background:' + TIER_COLOR[t] + '"></i>' + t + '</span>';
}).join("");

const catsEl = document.getElementById("categories");
catsEl.innerHTML = DATA.map(function(cat){
  const rows = TIER_ORDER
    .filter(function(t){ return cat.tiers[t] && cat.tiers[t].length; })
    .map(function(t){
      const chips = cat.tiers[t].map(function(item){
        return '<span class="chip">' + item + '</span>';
      }).join("");
      return '<div class="tier-row">' +
        '<div class="tier-badge" style="background:' + TIER_COLOR[t] + '">' + t + '</div>' +
        '<div class="chips">' + chips + '</div>' +
        '</div>';
    }).join("");
  return '<section class="category">' +
    '<div class="cat-head"><span class="icon">' + cat.icon + '</span><h2>' + cat.name + '</h2></div>' +
    rows +
    '</section>';
}).join("");
</script>

</body>
</html>
